name: snappy_neo
description: >-
  Pure Dart implementation of Google's Snappy compression: fast block-format
  compress and decompress, with a zero-copy Bytes API powered by blit.
version: 0.1.0
repository: https://github.com/unk-404/dart_snappy
issue_tracker: https://github.com/unk-404/dart_snappy/issues

topics:
  - compression
  - snappy
  - codec

environment:
  sdk: ^3.13.5

dependencies:
  blit: ^0.1.4

dev_dependencies:
  benchmark_test: ^0.1.2
  lints: ^6.0.0
  test: ^1.25.6
