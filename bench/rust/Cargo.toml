[package]
name = "snappy-oracle"
version = "0.1.0"
edition = "2021"
publish = false

# Reference implementation used by the interop tests and the benchmark chart.
# `snap` is pure Rust (no C++ toolchain needed on any CI runner).
[dependencies]
snap = "1.1"

[[bin]]
name = "snappy-oracle"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
